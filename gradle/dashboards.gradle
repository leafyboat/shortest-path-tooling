// --- Dashboards ---

def dashboardOutputRoot = layout.buildDirectory.dir('reports/pathfinder-dashboard')
def dashboardDataset = providers.gradleProperty('dashboardDataset')
        .orElse('/dashboard/routes.csv')
def dashboardSubtitle = providers.gradleProperty('dashboardSubtitle')
        .orElse('')
def dashboardProfile = providers.gradleProperty('dashboardProfile')
        .orElse('true')
def dashboardSeasonal = providers.gradleProperty('dashboardSeasonal')
        .orElse('false')
def dashboardF2p = providers.gradleProperty('dashboardF2p')
        .orElse('false')
// Derive bundle name and title from the dataset filename + profile flag.
// e.g. dataset=/dashboard/clue_locations_full.csv, profile=true
//   → bundle: clue-locations-full-profiled, title: Clue Locations Full Profiled
// Override with -PdashboardBundle=... or -PdashboardTitle=...
def profiled = dashboardProfile.get() == 'true'
def datasetStem = { String dataset ->
    def filename = dataset.tokenize('/').last()
    filename.contains('.') ? filename.substring(0, filename.lastIndexOf('.')) : filename
}
def bundleFor = { String dataset ->
    def slug = datasetStem(dataset).replace('_', '-').toLowerCase()
    profiled ? "${slug}-profiled" : slug
}
def titleFor = { String dataset ->
    datasetStem(dataset).tokenize('_').collect { it.capitalize() }.join(' ') + (profiled ? ' Profiled' : '')
}
def dashboardBundle = providers.gradleProperty('dashboardBundle')
        .orElse(bundleFor(dashboardDataset.get()))
def dashboardTitle = providers.gradleProperty('dashboardTitle')
        .orElse(titleFor(dashboardDataset.get()))
// Built alongside the default dataset when no -PdashboardDataset is given (see sailingDashboard)
def sailingDataset = '/dashboard/sailing_routes.csv'

def logDashboardLocation = { String taskName ->
    logger.lifecycle("")
    logger.lifecycle("${taskName} dashboard written.")
    logger.lifecycle("Serve it locally with:")
    logger.lifecycle("  python -m http.server --directory ${dashboardOutputRoot.get().asFile.absolutePath} 8000")
    logger.lifecycle("Then open: http://localhost:8000")
}

// Runs DashboardTest for one dataset, publishing it as one bundle of the shared site
def configureDashboard = { Test task, String dataset, String bundle, String title, String subtitle ->
    task.doNotTrackState('Dashboard always re-runs to pick up the latest dataset and config.')
    task.group = 'verification'
    task.testClassesDirs = sourceSets.test.output.classesDirs
    task.classpath = sourceSets.test.runtimeClasspath
    task.useJUnit()
    task.include 'shortestpath/dashboard/DashboardTest.class'
    task.ignoreFailures = true
    task.reports.junitXml.required = false
    task.reports.html.required = false
    task.jvmArgs = ['-Xms1g', '-Xmx8g']
    task.testLogging.showStandardStreams = true
    task.systemProperty 'runDashboardVerification', 'true'
    task.systemProperty 'dashboard.outputRoot', dashboardOutputRoot.get().asFile.absolutePath
    task.systemProperty 'dashboard.bundleName', bundle
    task.systemProperty 'dashboard.dataset', dataset
    task.systemProperty 'dashboard.profile', dashboardProfile.get()
    task.systemProperty 'dashboard.seasonal', dashboardSeasonal.get()
    task.systemProperty 'dashboard.f2p', dashboardF2p.get()
    if (!title.isEmpty()) {
        task.systemProperty 'dashboard.title', title
    }
    if (!subtitle.isEmpty()) {
        task.systemProperty 'dashboard.subtitle', subtitle
    }
}

tasks.register('dashboard', Test) {
    description = 'Builds the pathfinder dashboard from DashboardTest scenarios: the default routes and, ' +
            'through sailingDashboard, the sailing routes. ' +
            'Options (all via -P): dashboardDataset (default: /dashboard/routes.csv; when given, only that ' +
            'dataset is built), ' +
            'dashboardBundle, dashboardTitle, dashboardSubtitle, dashboardProfile (default: true), ' +
            'dashboardSeasonal (default: false; tags the bundle so the frontend renders the ' +
            'Demonic Pacts League regions overlay), ' +
            'dashboardF2p (default: false; tags the bundle so the frontend tints members-only chunks).'
    configureDashboard(it, dashboardDataset.get(), dashboardBundle.get(), dashboardTitle.get(), dashboardSubtitle.get())
    if (!providers.gradleProperty('dashboardDataset').isPresent()) {
        // Sailing first, so the default routes are the newest bundle and still the one the site opens on
        dependsOn 'sailingDashboard'
    }
    doLast { logDashboardLocation('dashboard') }
}

tasks.register('sailingDashboard', Test) {
    description = 'Builds the sailing routes bundle of the pathfinder dashboard from ' + sailingDataset + '. ' +
            'Rows with a speed also run the experimental sailing search when -PpluginDir points at a plugin ' +
            'checkout that has it. Takes the same -P options as dashboard, except the dataset, bundle and titles.'
    configureDashboard(it, sailingDataset, bundleFor(sailingDataset), titleFor(sailingDataset), '')
    doLast { logDashboardLocation('Sailing') }
}

tasks.register('sailingBenchmark', Test) {
    doNotTrackState('The benchmark always re-runs.')
    group = 'verification'
    description = 'Times the experimental sailing search against the existing search on routes at sea. ' +
            'Needs a plugin with the sailing search, e.g. -PpluginDir=../shortest-path. ' +
            'Options (all via -P): sailingBenchmarkDataset (default: /dashboard/sailing_routes.csv), ' +
            'sailingBenchmarkSpeeds (default: 1.5,3.0), sailingBenchmarkBoats (default: none,raft,skiff,sloop), ' +
            'sailingBenchmarkWarmup (default: 2), sailingBenchmarkRounds (default: 5). ' +
            'Writes build/reports/sailing-benchmark/<dataset>.md and .json.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnit()
    include 'shortestpath/dashboard/SailingBenchmarkTest.class'
    reports {
        junitXml.required = false
        html.required = false
    }
    jvmArgs = ['-Xms1g', '-Xmx8g']
    testLogging.showStandardStreams = true
    systemProperty 'sailingBenchmark.run', 'true'
    systemProperty 'sailingBenchmark.outputDir', layout.buildDirectory.dir('reports/sailing-benchmark').get().asFile.absolutePath
    ['dataset', 'speeds', 'boats', 'warmup', 'rounds'].each { option ->
        def value = providers.gradleProperty('sailingBenchmark' + option.capitalize())
        if (value.isPresent()) {
            systemProperty 'sailingBenchmark.' + option, value.get()
        }
    }
    doFirst {
        if (!pluginHasSailing) {
            throw new GradleException('The plugin checkout has no sailing search; point -PpluginDir at one that does, ' +
                    'e.g. -PpluginDir=../shortest-path')
        }
    }
}

