def f2pRegionsOutput = providers.gradleProperty('f2pRegionsOutput')
        .orElse(layout.buildDirectory.file('f2p-regions/regions.tsv').get().asFile.absolutePath)

tasks.register('f2pRegionDump', Test) {
    group = 'cache dumpers'
    description = 'Generates regions.tsv (regionId -> F2P|MEMBERS) for the F2P mode filter. ' +
            'Required: -Pf2pRegionsCacheDir=<cache dir>, -Pf2pRegionsXteaPath=<keys.json>. ' +
            'Optional: -Pf2pRegionsOutput=<tsv path>.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnit()
    // Inputs (./cache, keys.json) are -P strings Gradle cannot
    // fingerprint — never let an UP-TO-DATE skip serve stale output.
    outputs.upToDateWhen { false }
    include 'shortestpath/dump/F2pRegionDumperTest.class'
    systemProperty 'f2p.regions.dump', 'true'
    systemProperty 'f2p.regions.cacheDir', f2pRegionsCacheDir.get()
    systemProperty 'f2p.regions.xteaPath', f2pRegionsXteaPath.get()
    systemProperty 'f2p.regions.output', f2pRegionsOutput.get()
    jvmArgs = ['-Xms1g', '-Xmx8g']
    testLogging {
        showStandardStreams = true
    }
    doFirst {
        if (f2pRegionsCacheDir.get().isEmpty() || f2pRegionsXteaPath.get().isEmpty()) {
            throw new GradleException("f2pRegionDump requires -Pf2pRegionsCacheDir and -Pf2pRegionsXteaPath. " +
                    "Run collision-map-update/download-latest-cache.sh first to produce ./cache and ./keys.json, " +
                    "then patch keys.json (mapsquare->region, key->keys).")
        }
    }
    doLast {
        logger.lifecycle("")
        logger.lifecycle("F2P region mapping written to ${f2pRegionsOutput.get()}")
        if (file('shortest-path/src/main/resources/f2p').exists()) {
            logger.lifecycle("Copy into the plugin with:")
            logger.lifecycle("  cp ${f2pRegionsOutput.get()} shortest-path/src/main/resources/f2p/regions.tsv")
        } else {
            logger.lifecycle("F2P consumer not merged in the plugin yet — leaving staged output in build/; maintenance.py regions decides whether to copy")
        }
    }
}

