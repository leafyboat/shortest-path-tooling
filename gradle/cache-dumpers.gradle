// --- Cache dumpers ---
//
// Every Test task in this file forces re-execution via
// `outputs.upToDateWhen { false }`. The dumpers read ./cache and
// keys.json through -P property strings, which Gradle does not
// fingerprint as inputs — without the override an UP-TO-DATE skip
// after a cache refresh would silently serve stale output.

// Task registration is spec-driven: each map below describes one
// dumper/probe, and `registerCacheDumper` turns it into a
// `tasks.register(name, Test)` with the shared wiring (classpath,
// up-to-date override, -P providers, existence-checking doFirst
// guard) that used to be copy-pasted per task.
//
// Spec fields:
//   name          - gradle task name
//   description   - task description
//   testClass     - `include` pattern for the JUnit class
//   cachePrefix   - -P<prefix>CacheDir prop (must name an existing dir)
//   xteaPrefix    - -P<prefix>XteaPath prop (optional; must name an
//                   existing file when the spec sets it)
//   namesProp     - full -P name of a required names-file prop (optional)
//   outputProp    - -P name of an optional output-path override (optional)
//   outputDefault - buildDir-relative default for outputProp
//   sysProps      - static sysprops; every value MUST be a plain String —
//                   a GString in the systemProperties input map fails
//                   Gradle fingerprinting before doFirst can even run
//   sysPropKeys   - sysprop keys for the cacheDir/xtea/names/output props
//   hint          - optional doLast body: closure taking
//                   (resolvedOutputPath, defaultOutputPath)
//
// The -P names and -D sysprop keys are a load-bearing contract:
// maintenance.py PROBE_TASKS/NAMES_FILE_TASKS construct the -P names
// and the Java requiredProperty/getProperty call sites read the keys.
def cacheDumperSpecs = [
    // Scans all CLIENTSCRIPT archives for league relic teleport dispatch scripts.
    [
        name: 'leagueScriptScan',
        description: 'Scans all cs2 client scripts for league teleport destinations.',
        testClass: 'shortestpath/dump/LeagueScriptScannerTest.class',
        cachePrefix: 'leagueScript',
        xteaPrefix: 'leagueScript',
        sysProps: [
            'league.script.scan': 'true',
            'league.script.outPath': layout.buildDirectory
                    .file('league-scripts.txt').get().asFile.absolutePath,
        ],
        sysPropKeys: [cacheDir: 'league.script.cacheDir',
                      xtea: 'league.script.xteaPath'],
    ],
    // Enumerates DBTables with COORDGRID+STRING (candidate briefcase tables).
    [
        name: 'briefcaseTeleportTables',
        description: 'Enumerates DBTables with COORDGRID+STRING (candidate briefcase tables).',
        testClass: 'shortestpath/dump/BriefcaseTeleportTablesTest.class',
        cachePrefix: 'briefcaseTt',
        sysProps: [
            'briefcase.tt.scan': 'true',
            'briefcase.tt.outPath': layout.buildDirectory
                    .file('briefcase-teleport-tables.txt').get().asFile.absolutePath,
        ],
        sysPropKeys: [cacheDir: 'briefcase.tt.cacheDir'],
    ],
]

// Registers one dumper/probe Test task per spec entry. The factory is
// the single emission path for the fleet, so the shared invariants
// (upToDateWhen, jvmArgs, testLogging, existence guards) cannot drift
// per-task — and must never grow an ignoreFailures.
def registerCacheDumper = { Map spec ->
    def cacheDir = providers.gradleProperty("${spec.cachePrefix}CacheDir").orElse('')
    def xteaPath = spec.xteaPrefix
            ? providers.gradleProperty("${spec.xteaPrefix}XteaPath").orElse('')
            : null
    def namesFile = spec.namesProp
            ? providers.gradleProperty(spec.namesProp).orElse('')
            : null
    def output = spec.outputProp
            ? providers.gradleProperty(spec.outputProp)
                    .orElse(layout.buildDirectory.file(spec.outputDefault)
                            .get().asFile.absolutePath)
            : null

    tasks.register(spec.name, Test) {
        group = 'cache dumpers'
        description = spec.description
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnit()
        // Inputs (./cache, keys.json) are -P strings Gradle cannot
        // fingerprint — never let an UP-TO-DATE skip serve stale output.
        outputs.upToDateWhen { false }
        include spec.testClass
        spec.sysProps.each { k, v -> systemProperty k, v }
        systemProperty spec.sysPropKeys.cacheDir, cacheDir.get()
        if (xteaPath) systemProperty spec.sysPropKeys.xtea, xteaPath.get()
        if (namesFile) systemProperty spec.sysPropKeys.names, namesFile.get()
        if (output) systemProperty spec.sysPropKeys.output, output.get()
        jvmArgs = ['-Xms1g', '-Xmx8g']
        testLogging { showStandardStreams = true }
        doFirst {
            // Existence, not emptiness — a typo'd or absent path must
            // fail here, not inside the forked JVM.
            def bad = []
            if (!new File(cacheDir.get()).isDirectory()) {
                bad << "-P${spec.cachePrefix}CacheDir=${cacheDir.get()}"
            }
            if (xteaPath && !new File(xteaPath.get()).isFile()) {
                bad << "-P${spec.xteaPrefix}XteaPath=${xteaPath.get()}"
            }
            if (namesFile && !new File(namesFile.get()).isFile()) {
                bad << "-P${spec.namesProp}=${namesFile.get()}"
            }
            if (bad) {
                throw new GradleException(
                        "${spec.name} requires ${bad.join(', ')}. " +
                        "Run python3 scripts/maintenance.py cache first to produce ./cache and ./keys.json.")
            }
        }
        if (spec.hint) {
            def defaultOutput = layout.buildDirectory
                    .file(spec.outputDefault).get().asFile.absolutePath
            doLast { spec.hint(output.get(), defaultOutput) }
        }
    }
}

cacheDumperSpecs.each(registerCacheDumper)

// Dumps bank-related object placements (Bank booth / Bank chest / Bank table /
// deposit box / GE booth) from an OSRS cache to a TSV. Pair with
// scripts/rebuild_bank_tsv.py to add stand-tile rows to bank.tsv.
//
// Usage:
//   python3 scripts/maintenance.py cache   # produces ./cache and a patched ./keys.json
//   ./gradlew bankTileDump -PbankTileCacheDir=$PWD/cache -PbankTileXteaPath=$PWD/keys.json
def bankTileCacheDir = providers.gradleProperty('bankTileCacheDir').orElse('')
def bankTileXteaPath = providers.gradleProperty('bankTileXteaPath').orElse('')
def bankTileDefaultOutput = layout.buildDirectory
        .file('bank-tiles/bank_tile_placements.tsv').get().asFile.absolutePath
def bankTileOutput = providers.gradleProperty('bankTileOutput')
        .orElse(bankTileDefaultOutput)

tasks.register('bankTileDump', Test) {
    group = 'cache dumpers'
    description = 'Dumps bank-related object placements from an OSRS cache to a TSV. ' +
            'Required: -PbankTileCacheDir=<cache dir>, -PbankTileXteaPath=<keys.json>. ' +
            'Optional: -PbankTileOutput=<tsv path>.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnit()
    // Inputs (./cache, keys.json) are -P strings Gradle cannot
    // fingerprint — never let an UP-TO-DATE skip serve stale output.
    outputs.upToDateWhen { false }
    include 'shortestpath/dump/BankTileDumperTest.class'
    systemProperty 'bankTiles.dump', 'true'
    systemProperty 'bankTiles.cacheDir', bankTileCacheDir.get()
    systemProperty 'bankTiles.xteaPath', bankTileXteaPath.get()
    systemProperty 'bankTiles.output', bankTileOutput.get()
    jvmArgs = ['-Xms1g', '-Xmx8g']
    testLogging {
        showStandardStreams = true
    }
    doFirst {
        if (bankTileCacheDir.get().isEmpty() || bankTileXteaPath.get().isEmpty()) {
            throw new GradleException("bankTileDump requires -PbankTileCacheDir and -PbankTileXteaPath. " +
                    "Run collision-map-update/download-latest-cache.sh first to produce ./cache and ./keys.json, " +
                    "then patch keys.json (mapsquare->region, key->keys).")
        }
    }
    doLast {
        logger.lifecycle("")
        logger.lifecycle("Bank tile placements written to ${bankTileOutput.get()}")
        logger.lifecycle("Merge into bank.tsv with:")
        // rebuild_bank_tsv.py reads the default build/bank-tiles path —
        // only a custom -PbankTileOutput needs copying there first.
        if (bankTileOutput.get() != bankTileDefaultOutput) {
            logger.lifecycle("  cp ${bankTileOutput.get()} build/bank-tiles/bank_tile_placements.tsv")
        }
        logger.lifecycle("  python3 scripts/rebuild_bank_tsv.py")
    }
}

