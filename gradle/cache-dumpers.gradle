// Registers one dumper/probe Test task per spec entry. The factory is
// the single emission path for the fleet, so the shared invariants
// (upToDateWhen, jvmArgs, testLogging, existence guards) cannot drift
// per-task — and must never grow a failure-swallowing flag.
def registerCacheDumper = { Map spec ->
    def cacheDir = providers.gradleProperty("${spec.cachePrefix}CacheDir").orElse('')
    def xteaPath = spec.xteaPrefix
            ? providers.gradleProperty("${spec.xteaPrefix}XteaPath").orElse('')
            : null
    def namesFile = spec.namesProp
            ? providers.gradleProperty(spec.namesProp).orElse('')
            : null
    def output = spec.outputProp
            ? providers.gradleProperty(spec.outputProp)
                    .orElse(layout.buildDirectory.file(spec.outputDefault)
                            .get().asFile.absolutePath)
            : null

    tasks.register(spec.name, Test) {
        group = 'cache dumpers'
        description = spec.description
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnit()
        // Inputs (./cache, keys.json) are -P strings Gradle cannot
        // fingerprint — never let an UP-TO-DATE skip serve stale output.
        outputs.upToDateWhen { false }
        include spec.testClass
        spec.sysProps.each { k, v -> systemProperty k, v }
        systemProperty spec.sysPropKeys.cacheDir, cacheDir.get()
        if (xteaPath) systemProperty spec.sysPropKeys.xtea, xteaPath.get()
        if (namesFile) systemProperty spec.sysPropKeys.names, namesFile.get()
        if (output) systemProperty spec.sysPropKeys.output, output.get()
        jvmArgs = ['-Xms1g', '-Xmx8g']
        testLogging { showStandardStreams = true }
        doFirst {
            // Existence, not emptiness — a typo'd or absent path must
            // fail here, not inside the forked JVM.
            def bad = []
            if (!new File(cacheDir.get()).isDirectory()) {
                bad << "-P${spec.cachePrefix}CacheDir=${cacheDir.get()}"
            }
            if (xteaPath && !new File(xteaPath.get()).isFile()) {
                bad << "-P${spec.xteaPrefix}XteaPath=${xteaPath.get()}"
            }
            if (namesFile && !new File(namesFile.get()).isFile()) {
                bad << "-P${spec.namesProp}=${namesFile.get()}"
            }
            if (bad) {
                throw new GradleException(
                        "${spec.name} requires ${bad.join(', ')}. " +
                        "Run python3 scripts/maintenance.py cache first to produce ./cache and ./keys.json.")
            }
        }
        if (spec.hint) {
            def defaultOutput = layout.buildDirectory
                    .file(spec.outputDefault).get().asFile.absolutePath
            doLast { spec.hint(output.get(), defaultOutput) }
        }
    }
}

cacheDumperSpecs.each(registerCacheDumper)
