// Generates the regionId -> F2P/MEMBERS mapping consumed by F2pRegionChecker.
// Reads the curated bounding-box source-of-truth at
// src/test/resources/f2p_regions.tsv, walks every surface-level map region
// (chunkY < 100) in the cache, and emits the result as a TSV. Underground
// chunks are omitted (they default to UNKNOWN = permissive at runtime).
//
// Usage:
//   python3 scripts/maintenance.py cache   # produces ./cache and a patched ./keys.json
//   ./gradlew f2pRegionDump \
//     -Pf2pRegionsCacheDir=$PWD/cache \
//     -Pf2pRegionsXteaPath=$PWD/keys.json
//   cp build/f2p-regions/regions.tsv \
//     shortest-path/src/main/resources/f2p/regions.tsv
