plugins {
    id 'java'
    id 'checkstyle'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    // Plugin main sources via composite build (shortest-path is included in settings.gradle)
    testImplementation 'shortestpath:shortest-path'

    // RuneLite — needed directly because the plugin declares client as compileOnly
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
    testImplementation(group: 'net.runelite', name: 'cache', version: runeLiteVersion) {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:3.4.6'
    testImplementation 'com.google.code.gson:gson:2.10.1'

    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

tasks.withType(Checkstyle).configureEach {
    enabled = false
}

// DashboardTest runs its full scenario suite under `test` too — give the
// test JVM the same heap the dedicated `dashboard` task provides.
test {
    jvmArgs = ['-Xms1g', '-Xmx8g']
}

// The plugin checkout the build uses (see settings.gradle)
def pluginDir = findProperty('pluginDir') ?: 'shortest-path'

// The sailing tools (src/sailing/java) need a plugin with the experimental sailing search, so they're only
// compiled when the plugin checkout has it, e.g. with -PpluginDir=../shortest-path on a sailing branch
ext.pluginHasSailing = file("${pluginDir}/src/main/java/shortestpath/pathfinder/SailingMoves.java").exists()
if (pluginHasSailing) {
    sourceSets.test.java.srcDir 'src/sailing/java'
}

// Pull in the plugin's test helpers that the dashboard/dump code depends on.
// These files stay in the plugin's src/test/java (no changes to the plugin build).
compileTestJava.source fileTree(
    dir: "${pluginDir}/src/test/java",
    includes: [
        'shortestpath/pathfinder/TestPathfinderConfig.java',
        'shortestpath/TestShortestPathConfig.java',
    ]
)

apply from: 'gradle/dashboards.gradle'
apply from: 'gradle/cache-dumpers.gradle'
