<text x="24" y="32" font-size="15" fill="#1f2328" text-anchor="start" font-weight="600" >One tick of movement lands on the nearest sub-tile on each axis</text>
<text x="24" y="52" font-size="12" fill="#59636e" text-anchor="start" >Speed 2.0, in quarter tiles. Each axis of the exact move (the speed along the heading) rounds to the nearest</text>
<text x="24" y="69" font-size="12" fill="#59636e" text-anchor="start" >whole quarter tile, so the boat goes from sub-tile to sub-tile. NNE rounds down on both axes, NE up on both.</text>
